<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup & Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}">
</head>
<body>

<!-- Signup Section -->
<div class="login-container" id="signupSection">
  <h2>Create an Account</h2>
  <form id="signupForm" action="{{ url_for('signup') }}" method="POST">
    <div class="form-group">
      <input type="text" id="name" name="name" placeholder=" " required minlength="3" maxlength="50">
      <label for="name">Full Name</label>
    </div>

    <div class="form-group">
      <input type="email" id="email" name="email" placeholder=" " required>
      <label for="email">Email</label>
    </div>

    <div class="form-group">
      <input type="password" id="password" name="password" placeholder=" " required minlength="8">
      <label for="password">Password</label>
    </div>

    <div class="form-group">
      <input type="password" id="confirm_password" name="confirm_password" placeholder=" " required>
      <label for="confirm_password">Confirm Password</label>
    </div>

    <input type="submit" value="Sign Up">
  </form>
  <p class="link-text">Already have an account? <a href="#" id="showLogin">Login</a></p>
</div>

<!-- Login Section -->
<div class="login-container hidden" id="loginSection">
  <h2>Login</h2>
<form id="loginForm" action="{{ url_for('login') }}" method="POST">
    <div class="form-group">
      <input type="text" id="username" name="username" placeholder=" " required>
      <label for="username">Username or Email</label>
    </div>

    <div class="form-group">
      <input type="password" id="loginPassword" name="loginPassword" placeholder=" " required>
      <label for="loginPassword">Password</label>
    </div>

    <input type="submit" value="Login">
  </form>
  <p class="link-text">Don't have an account? <a href="#" id="showSignup">Sign Up</a></p>
</div>

<script src="{{ url_for('static', filename='js/signup.js') }}"></script>
</body>
</html>
